# Default values for proxmox-csi-plugin.
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.

replicaCount: 1

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# -- Create namespace.
# Very useful when using helm template.
createNamespace: false

# -- Controller pods priorityClassName.
priorityClassName: system-cluster-critical

# -- Pods Service Account.
# ref: https://kubernetes.io/docs/tasks/configure-pod-container/configure-service-account/
serviceAccount:
  # Specifies whether a service account should be created
  create: true
  # Annotations to add to the service account
  annotations: {}
  # The name of the service account to use.
  # If not set and create is true, a name is generated using the fullname template
  name: ""

# -- CSI Driver provisioner name.
# Currently, cannot be customized.
provisionerName: csi.proxmox.sinextra.dev

# CSIDriver object settings.
csidriver:
  # -- fsGroupPolicy controls whether kubelet recursively applies the pod's fsGroup to
  # the volume. `None` disables it (volumes keep their own permissions); use the
  # `rootDirPermissions` StorageClass parameter to make fresh volumes writable by
  # non-root pods. `ReadWriteOnceWithFSType` (the previous default) breaks workloads
  # such as Postgres that reject group-writable data directories. Note: this field is
  # immutable on an existing CSIDriver; changing it requires recreating the object.
  fsGroupPolicy: None

# -- Cluster name.
# Currently, cannot be customized.
clusterID: kubernetes

# -- Log verbosity level. See https://github.com/kubernetes/community/blob/master/contributors/devel/sig-instrumentation/logging.md
# for description of individual verbosity levels.
logVerbosityLevel: 5

# -- Connection timeout between sidecars.
timeout: 3m

options:
  # -- Enable or disable capacity feature.
  # ref: https://github.com/kubernetes-csi/external-provisioner
  enableCapacity: true

# -- Proxmox cluster config stored in secrets.
existingConfigSecret: ~
# -- Proxmox cluster config stored in secrets key.
existingConfigSecretKey: config.yaml

# -- Proxmox cluster config path.
configFile: /etc/proxmox/config.yaml

# -- Proxmox cluster config.
# ref: https://github.com/CrunchyMonkies/proxmox-csi-plugin/blob/main/docs/install.md
config:
  features:
    # specify provider: proxmox if you are using capmox (cluster api provider for proxmox)
    provider: "default"
    # reassign a volume's Proxmox ownership (vmid) to the real VM on attach.
    # default is false: see docs/reassign-volume-on-attach.md before enabling.
    # reassignVolumeOnAttach: false
  clusters: []
  #   - url: https://cluster-api-1.exmple.com:8006/api2/json
  #     insecure: false
  #     token_id: "login!name"
  #     token_secret: "secret"
  #     region: cluster-1

# -- Storage class definition.
storageClass: []
  # - name: proxmox-data-xfs
  #   storage: data
  #   For ceph storage you should use volumeBindingMode Immediate, defaults to WaitForFirstConsumer
  #   volumeBindingMode: WaitForFirstConsumer|Immediate
  #   reclaimPolicy: Delete
  #   fstype: ext4|xfs
  #
  #   # https://pve.proxmox.com/wiki/Performance_Tweaks
  #   cache: directsync|none|writeback|writethrough
  #   ssd: true
  #   extraParameters:
  #     # https://kubernetes-csi.github.io/docs/secrets-and-credentials-storage-class.html
  #     csi.storage.k8s.io/node-stage-secret-name: "proxmox-csi-secret"
  #     csi.storage.k8s.io/node-stage-secret-namespace: "kube-system"
  #     csi.storage.k8s.io/node-expand-secret-name: "proxmox-csi-secret"
  #     csi.storage.k8s.io/node-expand-secret-namespace: "kube-system"
  #
  #   mountOptions:
  #     - discard
  #
  #   # I am not recommending to use this option, but it is possible.
  #   # You should use region and zone topology keys together.
  #   allowedTopologies:
  #   - matchLabelExpressions:
  #     - key: topology.kubernetes.io/region
  #       values:
  #       - Region-1
  #     - key: topology.kubernetes.io/zone
  #       values:
  #       - pve-1
  #       - pve-3

controller:
  # -- Annotations for controller pod.
  # ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
  podAnnotations: {}
    # prometheus.io/scrape: "true"
    # prometheus.io/port: "8080"

  # -- Labels for controller pod.
  # ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
  podLabels: {}

  # -- Write the resolved Proxmox VMID back to each node as a
  # `proxmox.crunchymonkies.com/instance-id` annotation, so later lookups read the
  # annotation instead of scanning every VM in the cluster. Also grants the
  # controller `patch` on nodes.
  # Only has an effect where the providerID carries no VMID — notably rke2, whose
  # `rke2://<name>` is immutable. Leave off if a CCM already sets the providerID.
  annotateNodeInstanceID: false

  # -- Run the controller pod in the host network namespace, so it reaches the
  # Proxmox API as its node's own address rather than a pod address. Use where
  # the hypervisor firewall trusts the node subnets but not the pod CIDR.
  # Note: the ports below become host ports, and the scheduler does NOT account
  # for a bare `containerPort` under hostNetwork — with `replicaCount` > 1, or a
  # rolling update that surges, two pods can land on one node and fail to bind.
  # Set `updateStrategy.rollingUpdate.maxSurge: 0` when enabling this.
  hostNetwork: false

  # -- DNS policy for the controller pod. Defaults to `ClusterFirstWithHostNet`
  # when `hostNetwork` is on, because kubelet silently downgrades the usual
  # `ClusterFirst` to the host's resolv.conf in the host network namespace.
  dnsPolicy: ""

  plugin:
    # -- Controller CSI Driver.
    image:
      repository: ghcr.io/crunchymonkies/proxmox-csi-controller
      pullPolicy: IfNotPresent
      # Overrides the image tag whose default is the chart appVersion.
      tag: ""
    # -- Controller resource requests and limits.
    # ref: https://kubernetes.io/docs/user-guide/compute-resources/
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
  attacher:
    # -- CSI Attacher.
    # ref: https://github.com/kubernetes-csi/external-attacher
    image:
      repository: registry.k8s.io/sig-storage/csi-attacher
      pullPolicy: IfNotPresent
      tag: v4.10.0
    # -- Attacher arguments.
    # example: --default-fstype=ext4
    args:
      - --default-fstype=ext4
    # -- Attacher resource requests and limits.
    # ref: https://kubernetes.io/docs/user-guide/compute-resources/
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
  provisioner:
    # -- CSI Provisioner.
    # ref: https://github.com/kubernetes-csi/external-provisioner
    image:
      repository: registry.k8s.io/sig-storage/csi-provisioner
      pullPolicy: IfNotPresent
      tag: v5.3.0
    # -- Provisioner arguments.
    # example: --feature-gates=VolumeAttributesClass=true
    args:
      - --default-fstype=ext4
    # -- Provisioner resource requests and limits.
    # ref: https://kubernetes.io/docs/user-guide/compute-resources/
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
  resizer:
    # -- CSI Resizer.
    # refs: https://github.com/kubernetes-csi/external-resizer
    image:
      repository: registry.k8s.io/sig-storage/csi-resizer
      pullPolicy: IfNotPresent
      tag: v1.14.0
    # -- Resizer arguments.
    # example: --feature-gates=VolumeAttributesClass=true
    args: []
    # -- Resizer resource requests and limits.
    # ref: https://kubernetes.io/docs/user-guide/compute-resources/
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
  snapshotter:
    enabled: false
    # -- CSI Snapshotter.
    # refs: https://github.com/kubernetes-csi/external-snapshotter
    image:
      repository: registry.k8s.io/sig-storage/csi-snapshotter
      pullPolicy: IfNotPresent
      tag: v8.3.0
    # -- Snapshotter arguments.
    # example: --feature-gates=CSIVolumeGroupSnapshot=true
    args: []
    # -- Snapshotter resource requests and limits.
    # ref: https://kubernetes.io/docs/user-guide/compute-resources/
    resources:
      requests:
        cpu: 10m
        memory: 16Mi

node:
  plugin:
    # -- Node CSI Driver.
    image:
      repository: ghcr.io/crunchymonkies/proxmox-csi-node
      pullPolicy: IfNotPresent
      # Overrides the image tag whose default is the chart appVersion.
      tag: ""
    # -- Node CSI Driver resource requests and limits.
    # ref: https://kubernetes.io/docs/user-guide/compute-resources/
    resources: {}
  driverRegistrar:
    # -- Node CSI driver registrar.
    # ref: https://github.com/kubernetes-csi/node-driver-registrar
    image:
      repository: registry.k8s.io/sig-storage/csi-node-driver-registrar
      pullPolicy: IfNotPresent
      tag: v2.15.0
    # -- Driver registrar arguments.
    # example: --timeout=60s
    args: []
    # -- Node registrar resource requests and limits.
    # ref: https://kubernetes.io/docs/user-guide/compute-resources/
    resources:
      requests:
        cpu: 10m
        memory: 16Mi

  # -- Location of the /var/lib/kubelet directory as some k8s distribution differ from the standard.
  # Standard: /var/lib/kubelet, k0s: /var/lib/k0s/kubelet, microk8s: /var/snap/microk8s/common/var/lib/kubelet
  kubeletDir: /var/lib/kubelet

  # -- Node labels for node-plugin assignment.
  # ref: https://kubernetes.io/docs/user-guide/node-selection/
  nodeSelector: {}

  # -- Tolerations for node-plugin assignment.
  # ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
  tolerations:
    - key: karpenter.sh/disrupted
      operator: Exists
      effect: NoSchedule
    - key: node.kubernetes.io/unschedulable
      operator: Exists
      effect: NoSchedule
    - key: node.kubernetes.io/disk-pressure
      operator: Exists
      effect: NoSchedule

  # -- Affinity for node-plugin assignment.
  # ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
  affinity: {}

livenessprobe:
  # -- Common livenessprobe sidecar.
  image:
    repository: registry.k8s.io/sig-storage/livenessprobe
    pullPolicy: IfNotPresent
    tag: v2.16.0
  # -- Failure threshold for livenessProbe
  failureThreshold: 5
  # -- Initial delay seconds for livenessProbe
  initialDelaySeconds: 10
  # -- Timeout seconds for livenessProbe
  timeoutSeconds: 10
  # -- Period seconds for livenessProbe
  periodSeconds: 60
  # -- Liveness probe resource requests and limits.
  # ref: https://kubernetes.io/docs/user-guide/compute-resources/
  resources:
    requests:
      cpu: 10m
      memory: 16Mi

# -- Add additional init containers for the CSI controller pods.
# ref: https://kubernetes.io/docs/concepts/workloads/pods/init-containers/
initContainers: []
  # - name: loadbalancer
  #   restartPolicy: Always
  #   image: ghcr.io/sergelogvinov/haproxy:2.8.3-alpine3.18
  #   imagePullPolicy: IfNotPresent
  #   env:
  #     - name: SVC
  #       value: "proxmox.domain.com"
  #     - name: PORT
  #       value: "8006"
  #   securityContext:
  #     runAsUser: 99
  #     runAsGroup: 99
  #   resources:
  #     limits:
  #       cpu: 50m
  #       memory: 64Mi
  #     requests:
  #       cpu: 50m
  #       memory: 32Mi

# -- hostAliases Deployment pod host aliases
# ref: https://kubernetes.io/docs/tasks/network/customize-hosts-file-for-pods/
hostAliases: []
  # - ip: 127.0.0.1
  #   hostnames:
  #     - proxmox.domain.com

# -- Annotations for controller pod.
# ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/annotations/
podAnnotations: {}

# -- Labels for controller pod.
# ref: https://kubernetes.io/docs/concepts/overview/working-with-objects/labels/
podLabels: {}

# -- Controller Security Context.
# ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch

# -- Controller Container Security Context.
# ref: https://kubernetes.io/docs/tasks/configure-pod-container/security-context/#set-the-security-context-for-a-pod
securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault
  readOnlyRootFilesystem: true

# -- Controller deployment update strategy type.
# ref: https://kubernetes.io/docs/concepts/workloads/controllers/deployment/#updating-a-deployment
updateStrategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 1

# -- Prometheus metrics
metrics:
  # -- Enable Prometheus metrics.
  enabled: false
  # -- Prometheus metrics port.
  port: 8080

  type: annotation

# -- Node labels for controller assignment.
# ref: https://kubernetes.io/docs/user-guide/node-selection/
nodeSelector: {}
  # node-role.kubernetes.io/control-plane: ""

# -- Tolerations for controller assignment.
# ref: https://kubernetes.io/docs/concepts/configuration/taint-and-toleration/
tolerations: []
  # - key: node-role.kubernetes.io/control-plane
  #   effect: NoSchedule

# -- Affinity for controller assignment.
# ref: https://kubernetes.io/docs/concepts/configuration/assign-pod-node/#affinity-and-anti-affinity
affinity: {}

# -- Additional volumes for Pods
extraVolumes: []
# - name: ca
#   secret:
#     secretName: my-ca
# -- Additional volume mounts for Pods

extraVolumeMounts: []
# - mountPath: /etc/ssl/certs/ca-certificates.crt
#   name: ca
#   subPath: ca.crt

# -- Volume migration controller (pvecsictl controller).
# Watches PVCs for proxmox.crunchymonkies.com/migrate-node annotations and Nodes
# for proxmox.crunchymonkies.com/evacuate annotations, and migrates the backing
# Proxmox disks automatically. Authenticates with a scoped API token where the
# Proxmox nodes carry a permission-gated copy endpoint (`proxmod_endpoint: true`),
# and with root@pam otherwise.
migrator:
  # -- Enable the migration controller deployment.
  enabled: false

  # -- Number of replicas; leader election ensures only one acts.
  replicaCount: 1

  # -- Run the migrator pod (and the rebalance CronJob) in the host network
  # namespace. Same rationale as `controller.hostNetwork`: disk migration talks
  # to the Proxmox API with root credentials, so it is the other workload that
  # may need to arrive as the node.
  hostNetwork: false

  # -- DNS policy for the migrator pod. Defaults to `ClusterFirstWithHostNet`
  # when `hostNetwork` is on.
  dnsPolicy: ""

  image:
    # -- Migrator (pvecsictl) image.
    repository: ghcr.io/crunchymonkies/pvecsictl
    # -- Overrides the image tag whose default is the chart appVersion.
    tag: ""
    # -- Always or IfNotPresent.
    pullPolicy: IfNotPresent

  # -- Proxmox cluster config with ROOT credentials (username/password), the
  # same schema as `config`. Token auth is not sufficient for disk migration.
  # Stored in a separate secret from the CSI controller config.
  config:
    clusters: []
    #   - url: https://cluster-api-1.exmple.com:8006/api2/json
    #     insecure: false
    #     username: root@pam
    #     password: "strong-password"
    #     region: cluster-1
    #     # Preferred storage per Proxmox node, used by pod-follow/evacuation
    #     # when the source storage name does not exist on the target node.
    #     primary_storage:
    #       pve-3: local-zfs

  # -- Existing secret name for the migrator cloud config (overrides `migrator.config`).
  existingConfigSecret: ~
  # -- Existing secret key for the migrator cloud config.
  existingConfigSecretKey: config.yaml

  # -- Enable leader election.
  leaderElection: true

  # -- Copy volumes through the `proxmox-csi-storage` proxmod extension's
  # permission-gated endpoint instead of Proxmox' built-in root-only copy, so the
  # migrator authenticates with a scoped API token. Needs the `proxmod` and
  # `proxmox-csi-storage` packages on every Proxmox node.
  # This is the fleet-wide default; a cluster that sets `proxmod_endpoint` in the
  # cloud config overrides it, so a mixed fleet needs no flag at all.
  proxmodEndpoint: false

  # -- As `proxmodEndpoint`, but for the older `pve-csi-copy` package
  # (`token_copy_endpoint` per cluster). `proxmodEndpoint` wins if both are set.
  tokenCopyEndpoint: false

  # -- Volume follows pods: automatically migrate a volume when every pod
  # mounting it has been scheduled in a different zone (e.g. after VM
  # migration). Storage is matched by name, falling back to the cluster's
  # `primary_storage` map.
  podFollow: false

  # -- Reactive node evacuation: make a standard `kubectl drain` transparent
  # for zone-local volumes. When a pod cannot be scheduled because its volume
  # is pinned to a cordoned/tainted node, the controller migrates the volume so
  # the pod can schedule elsewhere. kubectl drain still owns stateless pod
  # eviction and PDBs; this only moves the volume. Opt-in and conservative.
  reactiveEvacuation:
    # -- Enable reactive evacuation.
    enabled: false
    # -- How long a pod must stay unschedulable before a migration is stamped.
    # Prevents a quick maintenance cordon+reboot from triggering a large copy.
    grace: 2m

  # -- Maximum migration attempts per PVC before marking it Failed.
  maxAttempts: 5

  # -- VM ID of the transient helper VM used to convert qcow2/vmdk volumes
  # to raw during migration. Must be a free VM ID and must differ from the
  # controller VMID.
  helperVMID: 9998

  # -- Proxmox disk move task timeout in seconds.
  taskTimeout: 10800

  # -- Maximum time to wait for pods to terminate during force-drain.
  drainTimeout: 10m

  # -- Maximum time to wait for a disk to detach from a VM.
  detachTimeout: 5m

  # -- Prometheus metrics for the migrator.
  metrics:
    enabled: false
    port: 8081

  # -- Additional migrator container arguments.
  extraArgs: []

  # -- Migrator resource requests and limits.
  resources:
    requests:
      cpu: 10m
      memory: 32Mi

  # -- Scheduled rebalancing of idle volumes from overloaded Proxmox nodes.
  rebalance:
    # -- Enable the rebalance CronJob.
    enabled: false
    # -- Rebalance schedule (cron format).
    schedule: "0 3 * * *"
    # -- Zones above this used fraction are rebalancing sources.
    highThreshold: 0.80
    # -- Only zones below this used fraction are rebalancing targets.
    lowThreshold: 0.60
    # -- Maximum volumes to move per run.
    maxMigrations: 2
    # -- Maintenance window "HH:MM-HH:MM"; outside it the job exits immediately.
    window: ""
    # -- IANA time zone for the maintenance window.
    windowTz: "UTC"
    # -- Additional rebalance arguments.
    extraArgs: []
