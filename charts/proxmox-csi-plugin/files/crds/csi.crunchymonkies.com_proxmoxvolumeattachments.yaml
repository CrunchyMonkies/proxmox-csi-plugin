---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: proxmoxvolumeattachments.csi.crunchymonkies.com
spec:
  group: csi.crunchymonkies.com
  names:
    categories:
    - proxmox
    kind: ProxmoxVolumeAttachment
    listKind: ProxmoxVolumeAttachmentList
    plural: proxmoxvolumeattachments
    shortNames:
    - pxattach
    - pxattaches
    singular: proxmoxvolumeattachment
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.volumeName
      name: Volume
      type: string
    - jsonPath: .spec.vmid
      name: VMID
      type: integer
    - jsonPath: .status.attached
      name: Attached
      type: boolean
    - jsonPath: .status.devicePath
      name: Device
      priority: 1
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ProxmoxVolumeAttachment binds one ProxmoxVolume to one Proxmox
          VM.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ProxmoxVolumeAttachmentSpec asks for one disk to be attached to one VM.

              Attachment is a separate kind from the volume on purpose. It is driven by a
              different sidecar (csi-attacher, not csi-provisioner) with an independent
              lifecycle, so keeping it separate stops attach churn conflicting with
              concurrent expand and modify writes on the volume object, mirrors upstream's
              own VolumeAttachment split, and lets admission policy gate *attach* -- the
              operation that actually crosses a tenant boundary -- on its own.

              Every field is immutable. An attachment is created and deleted, never edited.
            properties:
              nodeID:
                description: NodeID is the raw CSI node id, recorded for audit.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: nodeID is immutable
                  rule: self == oldSelf
              readonly:
                description: Readonly attaches the disk read-only.
                type: boolean
                x-kubernetes-validations:
                - message: readonly is immutable
                  rule: self == oldSelf
              vmid:
                description: |-
                  VMID is the target Proxmox VM.

                  This is the field that carries the whole attach authorization decision. The
                  tenant resolves nodeID to VMID from its own Node objects, so a compromised
                  tenant controller can name any VMID it likes. The operator re-checks it
                  against the tenant's live resolvedVmids before every attach; that check is
                  not optional.
                format: int32
                minimum: 100
                type: integer
                x-kubernetes-validations:
                - message: vmid is immutable
                  rule: self == oldSelf
              volumeID:
                description: |-
                  VolumeID is the handle the tenant believes it is publishing.

                  Carried redundantly on purpose. The operator refuses the attachment unless
                  it equals the referenced volume's status.volumeID AND that volume is in
                  this namespace. Two independent checks, so pointing a resource you own at
                  a handle you do not gets you nothing.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: volumeID is immutable
                  rule: self == oldSelf
              volumeName:
                description: VolumeName is a ProxmoxVolume in the same namespace.
                minLength: 1
                type: string
                x-kubernetes-validations:
                - message: volumeName is immutable
                  rule: self == oldSelf
            required:
            - nodeID
            - vmid
            - volumeID
            - volumeName
            type: object
          status:
            description: |-
              ProxmoxVolumeAttachmentStatus is written only by the operator.

              DevicePath, LUN and ResizeRequired are exactly the PublishContext map the node
              plugin consumes; the tenant-side backend passes them straight through.
            properties:
              attached:
                description: |-
                  Attached reports that the disk is in the VM's config and the operator has
                  confirmed it.
                type: boolean
              attachedAt:
                description: AttachedAt is when the attach completed.
                format: date-time
                type: string
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              devicePath:
                description: |-
                  DevicePath is the stable device link the node plugin looks for, e.g.
                  "/dev/disk/by-id/wwn-0x...".
                type: string
              lun:
                description: LUN is the SCSI index the disk was attached at.
                type: string
              observedGeneration:
                format: int64
                type: integer
              resizeRequired:
                description: ResizeRequired tells the node plugin to grow the filesystem
                  after mount.
                type: boolean
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
