---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: proxmoxstorages.csi.crunchymonkies.com
spec:
  group: csi.crunchymonkies.com
  names:
    categories:
    - proxmox
    kind: ProxmoxStorage
    listKind: ProxmoxStorageList
    plural: proxmoxstorages
    shortNames:
    - pxstore
    - pxstores
    singular: proxmoxstorage
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.region
      name: Region
      type: string
    - jsonPath: .spec.zone
      name: Zone
      type: string
    - jsonPath: .spec.storage
      name: Storage
      type: string
    - jsonPath: .spec.shared
      name: Shared
      type: boolean
    - jsonPath: .status.active
      name: Active
      type: boolean
    - format: byte
      jsonPath: .status.availableBytes
      name: Available
      type: integer
    - format: byte
      jsonPath: .status.totalBytes
      name: Total
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: ProxmoxStorage is the published capacity of one Proxmox storage.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              ProxmoxStorageSpec identifies one Proxmox storage in one place.

              The whole object is written by the operator, spec included -- there is no
              tenant-supplied intent here, only a published catalog. Tenants get read-only
              cluster-scoped access.

              This kind exists to keep GetCapacity off the hot path. csi-provisioner calls
              GetCapacity very frequently, and today it is served from a one-minute
              in-process cache. Turning that into a per-call round trip to the management
              apiserver would be a bad trade, so the tenant backend serves it entirely from
              a watch-backed informer over these objects and never issues a live GET.
            properties:
              pluginType:
                description: |-
                  PluginType is the Proxmox storage backend, e.g. "dir", "lvm", "lvmthin",
                  "zfspool", "nfs", "rbd". The provisioner needs this to determine the disk
                  filename format (file-level storages get a .raw or .qcow2 extension).
                type: string
              region:
                minLength: 1
                type: string
              shared:
                description: |-
                  Shared reports that this storage is visible from every node, in which case
                  volumes on it are not pinned to a zone.
                type: boolean
              storage:
                description: Storage is the Proxmox storage name.
                minLength: 1
                type: string
              types:
                description: |-
                  Types are the Proxmox content types the storage accepts, e.g. "images",
                  "rootdir".
                items:
                  type: string
                type: array
                x-kubernetes-list-type: set
              zone:
                description: Zone is the Proxmox node. Empty for storage shared across
                  the cluster.
                type: string
            required:
            - region
            - storage
            type: object
          status:
            description: ProxmoxStorageStatus carries the capacity figures.
            properties:
              active:
                description: |-
                  Active reports that Proxmox considers the storage online. A tenant must
                  treat an inactive storage as having no capacity rather than trusting the
                  last-known bytes.
                type: boolean
              availableBytes:
                format: int64
                type: integer
              conditions:
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastSyncTime:
                description: |-
                  LastSyncTime is when these figures were read from Proxmox. The tenant
                  refuses to serve capacity from an entry older than its staleness limit,
                  which is what bounds the management-outage degradation.
                format: date-time
                type: string
              totalBytes:
                format: int64
                type: integer
              usedBytes:
                format: int64
                type: integer
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
