{{- if .Values.migrator.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "proxmox-csi-plugin.fullname" . }}-migrator
  labels:
    {{- include "proxmox-csi-plugin.labels" . | nindent 4 }}
rules:
  # Find and force-drain pods that use a migrating PVC
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["csinodes"]
    verbs: ["get", "list"]
  # Cross-storage target selection and the rewire's StorageClass alignment list
  # the driver's StorageClasses to learn which Proxmox storages hold CSI volumes
  # (list only: no get, no watch/informer)
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["list"]
  # Recreate PV/PVC with the new topology
  - apiGroups: [""]
    resources: ["persistentvolumes"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "patch", "delete"]
  # Target-class quota pre-flight: before the rewire deletes the old PVC, the
  # migrator lists the namespace ResourceQuotas for headroom on the new class
  - apiGroups: [""]
    resources: ["resourcequotas"]
    verbs: ["list"]
  # Node cordoning/uncordoning and evacuation annotations
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "list", "watch", "patch"]
  # Migration progress events on PVCs and Nodes
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
  # Resolve token_ref cluster credentials from a Secret
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
{{- end }}
