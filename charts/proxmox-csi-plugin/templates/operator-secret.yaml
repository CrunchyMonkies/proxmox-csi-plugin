{{- if .Values.operator.enabled }}
{{- if not .Values.operator.existingConfigSecret }}
{{- include "proxmox-csi-plugin-operator.assertNoInlineCredentials" . }}
{{- if eq (len .Values.operator.config.clusters) 0 }}
{{- fail "operator.config.clusters is empty and operator.existingConfigSecret is unset: the operator has nothing to connect to." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "proxmox-csi-plugin-operator.configSecretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "proxmox-csi-plugin.labels" . | nindent 4 }}
type: Opaque
data:
  {{ include "proxmox-csi-plugin-operator.configSecretKey" . }}: {{ toYaml .Values.operator.config | b64enc | quote }}
{{- end }}
{{- end }}
