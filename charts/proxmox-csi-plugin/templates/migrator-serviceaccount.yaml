{{- if .Values.migrator.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "proxmox-csi-plugin.serviceAccountName" . }}-migrator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "proxmox-csi-plugin.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
