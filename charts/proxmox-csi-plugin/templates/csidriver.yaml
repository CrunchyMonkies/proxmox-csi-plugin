{{- if or .Values.controller.enabled .Values.node.enabled }}
apiVersion: storage.k8s.io/v1
kind: CSIDriver
metadata:
  name: {{ .Values.provisionerName }}
spec:
  attachRequired: true
  podInfoOnMount: true
  storageCapacity: true
  fsGroupPolicy: {{ .Values.csidriver.fsGroupPolicy | default "None" }}
  volumeLifecycleModes:
  - Persistent
{{- end }}
