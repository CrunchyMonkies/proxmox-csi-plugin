{{- if .Values.operator.enabled }}
{{- if .Values.operator.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "proxmox-csi-plugin.fullname" . }}-operator
  labels:
    {{- include "proxmox-csi-plugin.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "proxmox-csi-plugin.fullname" . }}-operator
subjects:
  - kind: ServiceAccount
    name: {{ include "proxmox-csi-plugin-operator.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
{{- end }}
