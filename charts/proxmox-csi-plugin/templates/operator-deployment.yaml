{{- if .Values.operator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "proxmox-csi-plugin.fullname" . }}-operator
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "proxmox-csi-plugin.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicaCount }}
  strategy:
    type: {{ .Values.operator.updateStrategy.type }}
    {{- if eq .Values.operator.updateStrategy.type "RollingUpdate" }}
    rollingUpdate:
      {{- toYaml .Values.operator.updateStrategy.rollingUpdate | nindent 6 }}
    {{- end }}
  selector:
    matchLabels:
      {{- include "proxmox-csi-plugin-operator.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if not .Values.operator.existingConfigSecret }}
        checksum/config: {{ toJson .Values.operator.config | sha256sum }}
        {{- end }}
      {{- with .Values.operator.podAnnotations }}
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "proxmox-csi-plugin-operator.selectorLabels" . | nindent 8 }}
        {{- with .Values.operator.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      {{- with .Values.priorityClassName }}
      priorityClassName: {{ . }}
      {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if .Values.operator.hostNetwork }}
      hostNetwork: true
      dnsPolicy: {{ .Values.operator.dnsPolicy | default "ClusterFirstWithHostNet" }}
      {{- else if .Values.operator.dnsPolicy }}
      dnsPolicy: {{ .Values.operator.dnsPolicy }}
      {{- end }}
      enableServiceLinks: false
      serviceAccountName: {{ include "proxmox-csi-plugin-operator.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.operator.podSecurityContext | nindent 8 }}
      {{- with .Values.operator.hostAliases }}
      hostAliases:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: operator
          securityContext:
            {{- toYaml .Values.operator.securityContext | nindent 12 }}
          image: "{{ .Values.operator.image.repository }}:{{ .Values.operator.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.operator.image.pullPolicy }}
          args:
            - "-cloud-config=/etc/proxmox/{{ include "proxmox-csi-plugin-operator.configSecretKey" . }}"
            - "-health-probe-address=:{{ .Values.operator.probePort }}"
            {{- if .Values.operator.metrics.enabled }}
            - "-metrics-address=:{{ .Values.operator.metrics.port }}"
            {{- else }}
            - "-metrics-address=0"
            {{- end }}
            - "-leader-elect={{ .Values.operator.leaderElection.enabled }}"
            {{- with .Values.operator.leaderElection.namespace }}
            - "-leader-election-namespace={{ . }}"
            {{- end }}
            - "-storage-sync-period={{ .Values.operator.storage.syncPeriod }}"
            - "-drift-detector={{ .Values.operator.drift.enabled }}"
            {{- if .Values.operator.drift.enabled }}
            - "-drift-interval={{ .Values.operator.drift.interval }}"
            {{- end }}
            - "-zap-log-level={{ .Values.operator.logLevel }}"
            - "-zap-encoder={{ .Values.operator.logEncoder }}"
            {{- if .Values.operator.volumeAPI.enabled }}
            - "-volume-api-address=:{{ .Values.operator.volumeAPI.port }}"
            - "-volume-api-rate={{ .Values.operator.volumeAPI.rateLimit }}"
            - "-volume-api-burst={{ .Values.operator.volumeAPI.burst }}"
            {{- end }}
            {{- range .Values.operator.extraArgs }}
            - {{ . | quote }}
            {{- end }}
          ports:
            {{- if .Values.operator.volumeAPI.enabled }}
            - name: volume-api
              containerPort: {{ .Values.operator.volumeAPI.port }}
              protocol: TCP
            {{- end }}
            {{- if .Values.operator.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.operator.metrics.port }}
              protocol: TCP
            {{- end }}
            - name: probe
              containerPort: {{ .Values.operator.probePort }}
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: probe
            initialDelaySeconds: 10
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /readyz
              port: probe
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            {{- toYaml .Values.operator.resources | nindent 12 }}
          volumeMounts:
            - name: cloud-config
              mountPath: /etc/proxmox/
              readOnly: true
            {{- with .Values.operator.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: cloud-config
          secret:
            secretName: {{ include "proxmox-csi-plugin-operator.configSecretName" . }}
        {{- with .Values.operator.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.operator.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.operator.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
