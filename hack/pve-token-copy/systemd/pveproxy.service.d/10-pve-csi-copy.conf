# pve-csi-copy loader for pveproxy.
#
# Why not PERL5LIB/PERL5OPT: pveproxy runs `#!/usr/bin/perl -T` (taint mode).
# Taint mode makes perl IGNORE both PERL5LIB and PERL5OPT, so an env-var loader is
# inert — the csi_copy_volume endpoint never registers in the running daemon.
# Instead the module lives in a DEFAULT @INC dir (/usr/share/perl5) and is pulled
# in with a command-line `-MPVECSICopy`.
#
# Why a wrapper (not a hardcoded ExecStart): pve-csi-copy-exec reads the base
# unit's REAL ExecStart at start time and injects only `-MPVECSICopy`, so it keeps
# working if a future PVE changes the daemon's invocation, args, or perl flags.
# It is deliberately FAIL-SAFE: on any problem (module hidden, shebang not perl,
# base command unreadable) it execs the daemon unmodified — a missing endpoint is
# acceptable, a dead pveproxy is not. The live-daemon verify catches a miss.
#
# Why override ExecReload: PVE's graceful reload (`pveproxy restart`) is an
# in-process exec() that drops the command-line `-M`, so a plain `systemctl
# reload` would silently unload the endpoint. Rewriting ExecReload as a full
# `systemctl restart` re-runs ExecStart (which re-loads the module) with no module
# drop and no reload deadlock. This also covers pve-manager upgrades, which call
# `deb-systemd-invoke reload-or-try-restart pveproxy.service` (an ExecReload).
[Service]
ExecStart=
ExecStart=/usr/lib/pve-csi-copy/pve-csi-copy-exec pveproxy
ExecReload=
ExecReload=-/bin/systemctl --no-block restart pveproxy.service
