{
    // Unique across the host; becomes the path segment
    // (/nodes/{node}/proxmod/csi-storage).
    "id": "csi-storage",

    "version": "0.3.0",

    "order": 50,

    "backend": {
        "module": "ProxmodExt::CSIStorage",

        // Both daemons: pveproxy must resolve the method in its own tree
        // before it will proxy the request to pvedaemon [PVE-F-052].
        "daemons": ["pvedaemon", "pveproxy"]
    }

    // No "frontend" key: backend-only extension, nothing to serve under
    // /proxmod/www.
}
