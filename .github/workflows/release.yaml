name: Release

on:
  workflow_dispatch: {}
  push:
    tags:
      # Fork releases are cut by pushing a bare semver tag (e.g. 1.0.0).
      # CI derives the published tag as <upstream>-<fork>, e.g. v0.18.1-1.0.0.
      # These patterns never match the derived v-prefixed tag, so the release
      # step below cannot re-trigger this workflow.
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*" # prereleases, e.g. 1.0.0-rc.1

jobs:
  build-publish:
    name: "Build image and publish"
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Unshallow
        run: git fetch --prune --unshallow

      - name: Compute release tag
        run: |
          FORK_VERSION="${GITHUB_REF_NAME}"          # e.g. 1.0.0
          UPSTREAM="$(cat hack/upstream-version)"    # e.g. v0.18.1
          echo "RELEASE_TAG=${UPSTREAM}-${FORK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3 # v4.1.0
        with:
          platforms: arm64
      - name: Set up docker buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Github registry login
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image owner
        run: echo "USERNAME=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build and push
        timeout-minutes: 10
        run: make images
        env:
          PUSH: "true"
          TAG: "edge"
      - name: Sign images
        timeout-minutes: 4
        run: make images-cosign
        env:
          TAG: "edge"

      - name: Build and push
        timeout-minutes: 10
        run: make images
        env:
          PUSH: "true"
          TAG: ${{ env.RELEASE_TAG }}
      - name: Sign images
        timeout-minutes: 4
        run: make images-cosign
        env:
          TAG: ${{ env.RELEASE_TAG }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=(--target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes)
          [[ "$GITHUB_REF_NAME" == *-* ]] && ARGS+=(--prerelease)
          gh release create "$RELEASE_TAG" "${ARGS[@]}"

  build-publish-cli:
    name: "Publish cli tool"
    # Only runs on the upstream repo. The fork lacks the BOT_APP_* / HOMEBREW_TOKEN
    # secrets and the sergelogvinov/homebrew-tap, so this job is skipped there
    # (keeping tag releases green); image publishing above is independent.
    if: ${{ github.repository_owner == 'sergelogvinov' }}
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
      - name: Unshallow
        run: git fetch --prune --unshallow

      - name: Set up go
        timeout-minutes: 5
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "go.mod"
      - name: Set up Cosign
        timeout-minutes: 1
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Generate token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          client-id: "${{ secrets.BOT_APP_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"
          owner: "${{ github.repository_owner }}"
          repositories: homebrew-tap
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          version: "v2.16.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TOKEN: ${{ steps.token.outputs.token }}
