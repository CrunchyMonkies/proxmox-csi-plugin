name: Release

on:
  workflow_dispatch: {}
  push:
    tags:
      # Fork releases are cut by pushing a bare semver tag (e.g. 1.0.0).
      # CI derives the published tag as <upstream>-<fork>, e.g. v0.18.1-1.0.0.
      # These patterns never match the derived v-prefixed tag, so the release
      # step below cannot re-trigger this workflow.
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*" # prereleases, e.g. 1.0.0-rc.1

jobs:
  build-publish:
    name: "Build image and publish"
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Unshallow
        run: git fetch --prune --unshallow

      - name: Compute release tag
        run: |
          FORK_VERSION="${GITHUB_REF_NAME}"          # e.g. 1.0.0
          UPSTREAM="$(cat hack/upstream-version)"    # e.g. v0.18.1
          echo "RELEASE_TAG=${UPSTREAM}-${FORK_VERSION}" >> "$GITHUB_ENV"

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
      - name: Set up docker buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Github registry login
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image owner
        run: echo "USERNAME=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Build and push
        timeout-minutes: 10
        run: make images
        env:
          PUSH: "true"
          TAG: "edge"
      - name: Sign images
        timeout-minutes: 10
        run: make images-cosign
        env:
          TAG: "edge"

      - name: Build and push
        timeout-minutes: 10
        run: make images
        env:
          PUSH: "true"
          TAG: ${{ env.RELEASE_TAG }}
      - name: Sign images
        timeout-minutes: 10
        run: make images-cosign
        env:
          TAG: ${{ env.RELEASE_TAG }}

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ARGS=(--target "$GITHUB_SHA" --title "$RELEASE_TAG" --generate-notes)
          [[ "$GITHUB_REF_NAME" == *-* ]] && ARGS+=(--prerelease)
          gh release create "$RELEASE_TAG" "${ARGS[@]}"

  build-publish-cli:
    name: "Publish cli tool"
    # Only runs on the upstream repo. The fork lacks the BOT_APP_* / HOMEBREW_TOKEN
    # secrets and the sergelogvinov/homebrew-tap, so this job is skipped there
    # (keeping tag releases green); image publishing above is independent.
    if: ${{ github.repository_owner == 'sergelogvinov' }}
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Unshallow
        run: git fetch --prune --unshallow

      - name: Set up go
        timeout-minutes: 5
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: "go.mod"
          cache: false
      - name: Set up Cosign
        timeout-minutes: 1
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Generate token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: token
        with:
          client-id: "${{ secrets.BOT_APP_ID }}"
          private-key: "${{ secrets.BOT_APP_PRIVATE_KEY }}"
          owner: "${{ github.repository_owner }}"
          repositories: homebrew-tap
      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: "v2.16.0"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TOKEN: ${{ steps.token.outputs.token }}
