name: proxmod-csi-storage deb

# Build-and-check only. The published artifact is attached to the fork release
# by release.yaml, which builds this same package from the tagged commit — so
# there is no separate proxmod-csi-storage-v* tag to cut. This job exists to
# catch a broken package at PR time, before a release depends on it.

on:
  pull_request:
    paths:
      - 'hack/proxmod-csi-storage/**'
      - '.github/workflows/proxmod-csi-storage-deb.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install build tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper dpkg-dev devscripts lintian perl

      - name: Static checks
        working-directory: hack/proxmod-csi-storage
        run: |
          make build
          python3 -c '
          import json, re, sys
          src = open("conf/50-proxmox-csi-storage.conf").read()
          m = json.loads(re.sub(r"^\s*//.*$", "", src, flags=re.M))
          assert m["id"] == "csi-storage", m["id"]
          assert m["backend"]["module"] == "ProxmodExt::CSIStorage", m["backend"]
          print("manifest ok:", m["id"], m.get("version"))
          '

      - name: Build deb
        working-directory: hack/proxmod-csi-storage
        run: dpkg-buildpackage -b -us -uc

      - name: Collect artifacts
        run: |
          mkdir -p dist
          mv hack/proxmox-csi-storage_*.deb dist/
          ls -l dist
          dpkg-deb -c dist/*.deb

      - name: Lintian (informational)
        run: lintian dist/*.deb || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: proxmod-csi-storage-deb
          path: dist/*.deb
          if-no-files-found: error
